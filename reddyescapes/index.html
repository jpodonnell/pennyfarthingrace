  normalGain: 0.55,
  currentTrackName: null,
  loopHandle: null,
  loopStart: 0
};

function audioInit() {
  if (audio.ctx) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audio.ctx = new Ctx();
    audio.master = audio.ctx.createGain();
    audio.master.gain.value = 0.55;
    audio.master.connect(audio.ctx.destination);
    audio.musicGain = audio.ctx.createGain();
    audio.musicGain.gain.value = 0.6;
    audio.musicGain.connect(audio.master);
    audio.sfxGain = audio.ctx.createGain();
    audio.sfxGain.gain.value = 0.7;
    audio.sfxGain.connect(audio.master);
  } catch (e) {
    audio.enabled = false;
  }
}

function audioResume() {
  if (!audio.ctx) audioInit();
  if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
}

function toggleMute() {
  audio.muted = !audio.muted;
  if (audio.master) {
    audio.master.gain.value = audio.muted ? 0 : audio.normalGain;
  }
}

function tone(freq, startTime, duration, type, gainNode, peakGain) {
  if (!audio.ctx || !audio.enabled) return;
  if (!freq || freq <= 0) return;
  const osc = audio.ctx.createOscillator();
  osc.type = type;
  osc.frequency.value = freq;
  const g = audio.ctx.createGain();
  g.gain.setValueAtTime(0, startTime);
  g.gain.linearRampToValueAtTime(peakGain, startTime + 0.005);
  g.gain.linearRampToValueAtTime(peakGain * 0.7, startTime + duration * 0.5);
  g.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(g);
  g.connect(gainNode);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.02);
}

function playSfx(type) {
  if (!audio.ctx || !audio.enabled) return;
  const t = audio.ctx.currentTime;
  if (type === 'jump') {
    const o = audio.ctx.createOscillator();
    const g = audio.ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(660, t + 0.10);
    g.gain.setValueAtTime(0.20, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g); g.connect(audio.sfxGain);
    o.start(t); o.stop(t + 0.13);
  } else if (type === 'land') {
    const o = audio.ctx.createOscillator();
    const g = audio.ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(140, t);
    o.frequency.exponentialRampToValueAtTime(70, t + 0.06);
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    o.connect(g); g.connect(audio.sfxGain);
    o.start(t); o.stop(t + 0.08);
  } else if (type === 'hit') {
    const o = audio.ctx.createOscillator();
    const g = audio.ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(120, t);
    o.frequency.linearRampToValueAtTime(60, t + 0.20);
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(g); g.connect(audio.sfxGain);
    o.start(t); o.stop(t + 0.23);
  } else if (type === 'coin') {
    tone(NOTE.C6, t,        0.05, 'square', audio.sfxGain, 0.18);
    tone(NOTE.E6, t + 0.05, 0.08, 'square', audio.sfxGain, 0.18);
  } else if (type === 'food') {
    tone(NOTE.G5, t,        0.10, 'triangle', audio.sfxGain, 0.20);
    tone(NOTE.C6, t + 0.10, 0.12, 'triangle', audio.sfxGain, 0.20);
  } else if (type === 'duck') {
    const o = audio.ctx.createOscillator();
    const g = audio.ctx.createGain();
    o.type = 'square';
    o.frequency.value = 150;
    g.gain.setValueAtTime(0.10, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    o.connect(g); g.connect(audio.sfxGain);
    o.start(t); o.stop(t + 0.07);
  } else if (type === 'level_complete') {
    const seq = [NOTE.C5, NOTE.E5, NOTE.G5, NOTE.C6];
    for (let i = 0; i < seq.length; i++) {
      tone(seq[i], t + i * 0.12, 0.13, 'square', audio.sfxGain, 0.18);
    }
  } else if (type === 'game_over') {
    const seq = [NOTE.G4, NOTE.E4, NOTE.C4, NOTE.G3];
    for (let i = 0; i < seq.length; i++) {
      tone(seq[i], t + i * 0.18, 0.22, 'sawtooth', audio.sfxGain, 0.18);
    }
  } else if (type === 'win') {
    const seq = [NOTE.C5, NOTE.E5, NOTE.G5, NOTE.C6, NOTE.E6, NOTE.G6];
    for (let i = 0; i < seq.length; i++) {
      tone(seq[i], t + i * 0.14, 0.16, 'square', audio.sfxGain, 0.20);
      tone(seq[i] * 0.5, t + i * 0.14, 0.16, 'triangle', audio.sfxGain, 0.18);
    }
  }
}

function startMusic(trackName) {
  stopMusic();
  if (!audio.ctx) audioInit();
  if (!audio.ctx) return;
  const track = TRACKS[trackName];
  if (!track) return;
  audio.currentTrackName = trackName;
  audio.loopStart = audio.ctx.currentTime + 0.1;
  // restore music gain (stopMusic silenced it)
  audio.musicGain.gain.cancelScheduledValues(audio.ctx.currentTime);
  audio.musicGain.gain.setValueAtTime(0.6, audio.ctx.currentTime);
  scheduleTrackLoop();
}

function scheduleTrackLoop() {
  if (!audio.ctx) return;
  const trackName = audio.currentTrackName;
  if (!trackName) return;
  const track = TRACKS[trackName];
  if (!track) return;

  const beat = 60 / track.bpm / 2;
  const startTime = Math.max(audio.ctx.currentTime + 0.02, audio.loopStart);

  // Melody (square)
  let mt = startTime;
  for (let i = 0; i < track.melody.length; i++) {
    const [n, dur] = track.melody[i];
    const f = NOTE[n];
    if (f && f > 0) tone(f, mt, dur * beat * 0.95, 'square', audio.musicGain, 0.05);
    mt += dur * beat;
  }
  // Bass (triangle)
  let bt = startTime;
  for (let i = 0; i < track.bass.length; i++) {
    const [n, dur] = track.bass[i];
    const f = NOTE[n];
    if (f && f > 0) tone(f, bt, dur * beat * 0.95, 'triangle', audio.musicGain, 0.10);
    bt += dur * beat;
  }
  const loopEnd = Math.max(mt, bt);
  audio.loopStart = loopEnd;
  const msToNext = (loopEnd - audio.ctx.currentTime) * 1000 - 100;
  audio.loopHandle = setTimeout(scheduleTrackLoop, Math.max(50, msToNext));
}

function stopMusic() {
  if (audio.loopHandle) {
    clearTimeout(audio.loopHandle);
    audio.loopHandle = null;
  }
  audio.currentTrackName = null;
  // Silence currently-scheduled music notes by ducking the music gain
  if (audio.musicGain && audio.ctx) {
    audio.musicGain.gain.cancelScheduledValues(audio.ctx.currentTime);
    audio.musicGain.gain.setValueAtTime(0, audio.ctx.currentTime);
  }
}

const keys = {};
const keyPressed = {};
window.addEventListener('keydown', (e) => {
  audioResume();
  if (!keys[e.code]) keyPressed[e.code] = true;
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Escape','KeyP','KeyM'].indexOf(e.code) >= 0) {
    e.preventDefault();
  }
  if (e.code === 'KeyM') toggleMute();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('mousedown', audioResume);
window.addEventListener('touchstart', audioResume, { passive: true });

const SOLID_TYPES = new Set(['box', 'stump', 'dumpster', 'bench', 'barrier', 'outcrop', 'parked_car', 'fountain']);
const HAZARD_GROUND = new Set(['rock', 'log', 'fence', 'hydrant', 'newsstand', 'gnome', 'hedge', 'wheeliebin', 'trashcan', 'dog', 'car', 'truck', 'rolling_log', 'boulder']);

// ============================================================
// HELPERS
// ============================================================
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function groundXAt(x) {
  for (let i = 0; i < groundSegs.length; i++) {
    const s = groundSegs[i][0], e = groundSegs[i][1];
    if (x >= s && x < e) return true;
  }
  return false;
}

function damage(amount) {
  if (player.invincible > 0) return;
  player.health -= amount;
  player.invincible = IFRAMES;
  playSfx('hit');
  if (player.health <= 0) {
    player.health = 0;
    gameState = STATE.GAMEOVER;
    stateTimer = 0;
    stopMusic();
    playSfx('game_over');
  }
}

function getPlayerHitbox() {
  const hitH = player.ducking ? 14 : 24;
  const yOff = player.ducking ? 10 : 0;
  return { x: player.x, y: player.y + yOff, w: player.w, h: hitH };
}

// ============================================================
// SPRITES
// ============================================================
function px(x, y, w, h) {
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

function drawReddy(x, y, state, frame, facing, ducking) {
  ctx.save();
  if (ducking) {
    ctx.translate(Math.floor(x), Math.floor(y) + 10);
  } else {
    ctx.translate(Math.floor(x), Math.floor(y));
  }
  if (facing < 0) {
    ctx.scale(-1, 1);
    ctx.translate(-12, 0);
  }

  if (ducking) {
    // 12 wide, 14 tall ducking sprite (legs tucked, body forward)
    // Tail (trailing)
    ctx.fillStyle = COL.RUST;  px(-3, 4, 3, 2);
    ctx.fillStyle = COL.CREAM; px(-3, 6, 3, 2);
    ctx.fillStyle = COL.RUST;  px(-3, 8, 3, 2);
    // Body
    ctx.fillStyle = COL.RUST;  px(0, 5, 12, 7);
    ctx.fillStyle = COL.CREAM; px(2, 7, 8, 4);
    // Head (low forward)
    ctx.fillStyle = COL.RUST;  px(2, 0, 10, 7);
    // Ears
    ctx.fillStyle = COL.ORANGE; px(2, -1, 2, 2); px(10, -1, 2, 2);
    // Face mask
    ctx.fillStyle = COL.CREAM; px(3, 2, 2, 3); px(9, 2, 2, 3);
    // Eyes
    ctx.fillStyle = COL.WHITE; px(4, 3, 1, 1); px(10, 3, 1, 1);
    ctx.fillStyle = COL.BLACK; px(4, 4, 1, 1); px(10, 4, 1, 1);
    // Nose
    ctx.fillStyle = COL.BLACK; px(7, 5, 2, 1);
    // Legs tucked
    ctx.fillStyle = COL.DARK;  px(2, 12, 3, 2); px(7, 12, 3, 2);
  } else {
    // 12 wide, 24 tall standing sprite
    const isWalk = state === 'walk';
    const isJump = state === 'jump';
    const isClimb = state === 'climb';

    // --- TAIL (ringed, behind body) ---
    const tailWag = (state === 'idle') ? Math.sin(frameCount * 0.08) * 1 : 0;
    ctx.fillStyle = COL.RUST;
    px(-2, 11 + tailWag, 3, 2);
    ctx.fillStyle = COL.CREAM;
    px(-3, 13 + tailWag, 3, 2);
    ctx.fillStyle = COL.RUST;
    px(-3, 15 + tailWag, 3, 2);
    ctx.fillStyle = COL.CREAM;
    px(-2, 17 + tailWag, 3, 2);
    ctx.fillStyle = COL.RUST;
    px(-1, 18 + tailWag, 2, 1);

    // --- BODY ---
    ctx.fillStyle = COL.RUST;
    px(1, 10, 10, 9);
    // shading on top
    ctx.fillStyle = COL.RUST_LT;
    px(2, 10, 8, 1);
    // belly
    ctx.fillStyle = COL.CREAM;
    px(3, 12, 6, 6);

    // --- HEAD ---
    ctx.fillStyle = COL.RUST;
    px(1, 1, 10, 9);
    // top shading
    ctx.fillStyle = COL.RUST_LT;
    px(2, 1, 8, 1);

    // ears (orange/dark inner)
    ctx.fillStyle = COL.ORANGE;
    px(0, 0, 3, 2);
    px(9, 0, 3, 2);
    ctx.fillStyle = COL.RUST;
    px(1, 1, 1, 1);
    px(10, 1, 1, 1);

    // face mask (cream around eyes)
    ctx.fillStyle = COL.CREAM;
    px(2, 4, 2, 3);
    px(8, 4, 2, 3);
    px(4, 6, 4, 2);

    // eyes whites
    ctx.fillStyle = COL.WHITE;
    px(2, 5, 2, 1);
    px(8, 5, 2, 1);
    // pupils (centered, look forward)
    ctx.fillStyle = COL.BLACK;
    px(3, 5, 1, 1);
    px(8, 5, 1, 1);

    // nose
    ctx.fillStyle = COL.BLACK;
    px(5, 8, 2, 1);
    // mouth
    px(5, 9, 1, 1);

    // --- ARMS ---
    ctx.fillStyle = COL.RUST;
    if (isJump) {
      px(0, 11, 2, 4);
      px(10, 11, 2, 4);
    } else if (isClimb) {
      const cy = (frame % 2) ? 0 : 2;
      px(0, 9 + cy, 2, 4);
      px(10, 9 - cy, 2, 4);
    } else if (isWalk) {
      const swing = (frame % 2) ? 1 : -1;
      px(0, 11 + swing, 2, 4);
      px(10, 11 - swing, 2, 4);
    } else {
      px(0, 12, 2, 4);
      px(10, 12, 2, 4);
    }

    // --- LEGS ---
    ctx.fillStyle = COL.DARK;
    if (isJump) {
      px(2, 19, 3, 3);
      px(7, 19, 3, 3);
      ctx.fillStyle = COL.BLACK;
      px(2, 22, 3, 1);
      px(7, 22, 3, 1);
    } else if (isWalk) {
      if (frame % 2 === 0) {
        px(2, 19, 3, 5);
        px(7, 19, 3, 4);
        ctx.fillStyle = COL.BLACK;
        px(1, 23, 4, 1);
        px(7, 22, 3, 1);
      } else {
        px(2, 19, 3, 4);
        px(7, 19, 3, 5);
        ctx.fillStyle = COL.BLACK;
        px(2, 22, 3, 1);
        px(7, 23, 4, 1);
      }
    } else if (isClimb) {
      const cy = (frame % 2) ? 1 : -1;
      px(2, 19 + cy, 3, 4);
      px(7, 19 - cy, 3, 4);
      ctx.fillStyle = COL.BLACK;
      px(2, 22 + cy, 3, 1);
      px(7, 22 - cy, 3, 1);
    } else {
      px(2, 19, 3, 5);
      px(7, 19, 3, 5);
      ctx.fillStyle = COL.BLACK;
      px(2, 23, 3, 1);
      px(7, 23, 3, 1);
    }
  }

  ctx.restore();
}

// ============================================================
// BACKGROUND DRAWING
// ============================================================
function drawSkyGradient() {
  // simple two-tone sky
  ctx.fillStyle = COL.SKY_TOP;
  ctx.fillRect(0, 0, VW, 90);
  ctx.fillStyle = COL.SKY_BOT;
  ctx.fillRect(0, 90, VW, 110);
}

function drawCloud(x, y, scale) {
  scale = scale || 1;
  ctx.fillStyle = COL.CLOUD;
  px(x + 4, y, 12 * scale, 4);
  px(x, y + 4, 24 * scale, 4);
  px(x + 4, y + 8, 16 * scale, 3);
}

function drawHill(x, y, w, color) {
  ctx.fillStyle = color;
  // rounded hill — stack of decreasing rects
  const step = 4;
  for (let i = 0; i < w / 2; i += step) {
    const inset = Math.floor(Math.sqrt(i / (w / 2)) * 14);
    px(x + i, y + inset, step, VH - y - inset);
    px(x + w - i - step, y + inset, step, VH - y - inset);
  }
  px(x + w / 2 - 2, y, 4, VH - y);
}

function drawFarBg() {
  // Clouds (parallax 0.15)
  const cloudOff = (camera.x * 0.15);
  for (let i = -1; i < 8; i++) {
    const baseX = i * 180 - (cloudOff % 180);
    drawCloud(baseX + 20, 25, 1);
    drawCloud(baseX + 100, 50, 1);
    drawCloud(baseX + 60, 70, 1);
  }
  // Distant hills (parallax 0.3)
  const hillOff = (camera.x * 0.3);
  for (let i = -1; i < 6; i++) {
    const x = i * 200 - (hillOff % 200);
    drawHill(x, 130, 200, COL.HILL_FAR);
  }
}

function drawTreeBg(x, y) {
  // Trunk
  ctx.fillStyle = COL.LOG_DK;
  px(x + 10, y + 18, 4, 14);
  // Foliage clusters
  ctx.fillStyle = COL.HILL_FAR;
  px(x + 4, y + 8, 16, 14);
  px(x, y + 12, 24, 8);
  px(x + 6, y + 4, 12, 8);
  ctx.fillStyle = COL.HILL_NEAR;
  px(x + 6, y + 10, 4, 4);
  px(x + 14, y + 6, 4, 4);
}

function drawMidBg() {
  // Trees behind fence (parallax 0.5)
  const treeOff = (camera.x * 0.5);
  for (let i = -1; i < 10; i++) {
    const x = i * 100 - (treeOff % 100);
    drawTreeBg(x + 10, 130);
  }
  // Zoo fence — wooden vertical bars across the lower mid bg
  const fenceOff = (camera.x * 0.5);
  ctx.fillStyle = COL.FENCE;
  for (let i = -1; i < 32; i++) {
    const x = i * 16 - (fenceOff % 16);
    px(x, 168, 3, 36);
  }
  // pickets pointed tops
  ctx.fillStyle = COL.FENCE_DK;
  for (let i = -1; i < 32; i++) {
    const x = i * 16 - (fenceOff % 16);
    px(x, 166, 3, 2);
  }
  // horizontal rails
  ctx.fillStyle = COL.FENCE_DK;
  px(0, 175, VW, 2);
  px(0, 195, VW, 2);
}

// ============================================================
// FOREGROUND DRAWING
// ============================================================
function drawGround() {
  for (let i = 0; i < groundSegs.length; i++) {
    const s = groundSegs[i][0], e = groundSegs[i][1];
    // grass top
    ctx.fillStyle = COL.GRASS;
    px(s, GROUND_Y, e - s, 4);
    ctx.fillStyle = COL.GRASS_DK;
    px(s, GROUND_Y + 4, e - s, 2);
    // grass blades
    ctx.fillStyle = COL.GRASS_BLADE;
    for (let x = s; x < e; x += 12) {
      px(x + ((x * 7) % 8), GROUND_Y - 1, 1, 2);
    }
    // dirt
    ctx.fillStyle = COL.DIRT;
    px(s, GROUND_Y + 6, e - s, VH - GROUND_Y - 6);
    // dirt details
    ctx.fillStyle = COL.DIRT_DK;
    for (let x = s; x < e; x += 24) {
      px(x + 4, GROUND_Y + 12, 6, 2);
      px(x + 14, GROUND_Y + 22, 4, 2);
    }
    ctx.fillStyle = COL.DIRT_LT;
    for (let x = s; x < e; x += 32) {
      px(x + 18, GROUND_Y + 16, 4, 1);
    }
  }
}

function drawRock(o) {
  ctx.fillStyle = COL.ROCK_DK;
  px(o.x, o.y + o.h - 2, o.w, 2);
  ctx.fillStyle = COL.ROCK;
  px(o.x + 1, o.y + 2, o.w - 2, o.h - 2);
  px(o.x, o.y + 4, o.w, o.h - 6);
  ctx.fillStyle = COL.ROCK_LT;
  px(o.x + 2, o.y, o.w - 4, 3);
  px(o.x + 4, o.y + 3, 4, 1);
  ctx.fillStyle = COL.ROCK_DK;
  px(o.x + o.w - 4, o.y + 4, 2, 2);
  px(o.x + 2, o.y + o.h - 4, 2, 1);
}

function drawLog(o) {
  // log body
  ctx.fillStyle = COL.LOG;
  px(o.x, o.y + 2, o.w, o.h - 4);
  ctx.fillStyle = COL.LOG_LT;
  px(o.x, o.y + 2, o.w, 2);
  ctx.fillStyle = COL.LOG_DK;
  px(o.x, o.y + o.h - 4, o.w, 2);
  // bark texture lines
  ctx.fillStyle = COL.LOG_DK;
  for (let i = 4; i < o.w - 4; i += 6) {
    px(o.x + i, o.y + 5, 2, 4);
  }
  // end caps (rings)
  ctx.fillStyle = COL.LOG_LT;
  px(o.x - 2, o.y + 4, 4, o.h - 8);
  px(o.x + o.w - 2, o.y + 4, 4, o.h - 8);
  ctx.fillStyle = COL.LOG_DK;
  px(o.x - 1, o.y + (o.h / 2) - 1, 2, 2);
  px(o.x + o.w - 1, o.y + (o.h / 2) - 1, 2, 2);
}

function drawBox(o) {
  // wooden crate
  ctx.fillStyle = COL.BOX;
  px(o.x, o.y, o.w, o.h);
  ctx.fillStyle = COL.BOX_LT;
  px(o.x, o.y, o.w, 2);
  px(o.x, o.y, 2, o.h);
  ctx.fillStyle = COL.BOX_DK;
  px(o.x + o.w - 2, o.y, 2, o.h);
  px(o.x, o.y + o.h - 2, o.w, 2);
  // diagonal planks
  ctx.fillStyle = COL.BOX_DK;
  for (let i = 0; i < o.w; i += 2) {
    px(o.x + i, o.y + i, 1, 1);
    px(o.x + (o.w - i - 1), o.y + i, 1, 1);
  }
  // ladder on left side
  ctx.fillStyle = COL.LADDER;
  px(o.x - 4, o.y, 2, o.h);
  px(o.x + 2, o.y, 2, o.h);
  for (let r = 4; r < o.h - 2; r += 6) {
    px(o.x - 4, o.y + r, 8, 2);
  }
}

function drawStump(o) {
  // trunk
  ctx.fillStyle = COL.STUMP;
  px(o.x, o.y + 4, o.w, o.h - 4);
  ctx.fillStyle = COL.DIRT_DK;
  for (let i = 4; i < o.w; i += 6) {
    px(o.x + i, o.y + 8, 2, o.h - 12);
  }
  // top (ring pattern)
  ctx.fillStyle = COL.STUMP_TOP;
  px(o.x, o.y, o.w, 6);
  ctx.fillStyle = COL.STUMP_RING;
  px(o.x + 4, o.y + 2, o.w - 8, 1);
  px(o.x + 8, o.y + 4, o.w - 16, 1);
  ctx.fillStyle = COL.LOG_DK;
  px(o.x, o.y + 5, o.w, 1);
}

function drawStream(o) {
  // dirt walls inside the gap
  ctx.fillStyle = COL.DIRT_DK;
  px(o.x - 2, o.y, 2, 8);
  px(o.x + o.w, o.y, 2, 8);
  // water
  ctx.fillStyle = COL.WATER_DK;
  px(o.x, o.y, o.w, o.h);
  ctx.fillStyle = COL.WATER;
  px(o.x, o.y + 2, o.w, o.h - 4);
  // surface ripples
  ctx.fillStyle = COL.WATER_LT;
  for (let i = 0; i < o.w; i += 6) {
    const wave = Math.floor(Math.sin((frameCount * 0.1 + i * 0.5)) * 1);
    px(o.x + i, o.y + 2 + wave, 3, 1);
  }
  // sparkles
  ctx.fillStyle = COL.WHITE;
  for (let i = 4; i < o.w; i += 12) {
    if ((frameCount + i) % 60 < 20) {
      px(o.x + i + 2, o.y + 4, 1, 1);
    }
  }

  // Splash effect when Reddy is swimming in this stream
  if (player.swimming) {
    const pc = player.x + player.w / 2;
    if (pc >= o.x && pc < o.x + o.w) {
      const sx = Math.floor(pc);
      // splash drops
      ctx.fillStyle = COL.WATER_LT;
      const splashPhase = frameCount % 16;
      if (splashPhase < 8) {
        px(sx - 3, o.y - 1 + (splashPhase < 4 ? -splashPhase : splashPhase - 8), 1, 1);
        px(sx + 3, o.y - 1 + (splashPhase < 4 ? -splashPhase : splashPhase - 8), 1, 1);
        px(sx,     o.y - 2 + (splashPhase < 4 ? -splashPhase * 0.5 : 0), 1, 1);
      }
      ctx.fillStyle = COL.WHITE;
      px(sx - 2, o.y, 1, 1);
      px(sx + 2, o.y, 1, 1);
    }
  }
}

function drawBranch(o) {
  // hanging branch with leaves
  ctx.fillStyle = COL.BRANCH;
  px(o.x, o.y + 2, o.w, 4);
  ctx.fillStyle = COL.LOG_DK;
  px(o.x, o.y + 2, o.w, 1);
  px(o.x, o.y + 5, o.w, 1);
  // leaves
  ctx.fillStyle = COL.BRANCH_LEAF;
  for (let i = 0; i < o.w; i += 8) {
    px(o.x + i, o.y - 2, 6, 4);
    px(o.x + i + 2, o.y + 6, 4, 4);
  }
  ctx.fillStyle = COL.HILL_NEAR;
  for (let i = 4; i < o.w; i += 12) {
    px(o.x + i, o.y - 4, 4, 4);
  }
  // tree connection on left
  ctx.fillStyle = COL.LOG_DK;
  px(o.x - 6, o.y - 8, 6, 16);
}

function drawDen(o) {
  // grassy mound
  ctx.fillStyle = COL.HILL_DEN;
  for (let i = 0; i < o.w; i += 2) {
    const cx = i - o.w / 2;
    const inset = Math.floor((cx * cx) / (o.w * 0.5));
    px(o.x + i, o.y + inset, 2, o.h - inset + 16);
  }
  ctx.fillStyle = COL.GRASS_DK;
  for (let i = 0; i < o.w; i += 4) {
    const cx = i - o.w / 2;
    const inset = Math.floor((cx * cx) / (o.w * 0.5));
    px(o.x + i, o.y + inset, 1, 2);
  }
  // den opening (cave mouth)
  const dx = o.x + o.w / 2 - 10;
  const dy = o.y + o.h - 24;
  ctx.fillStyle = COL.DEN_RIM;
  px(dx - 2, dy, 24, 24);
  ctx.fillStyle = COL.DEN;
  px(dx, dy + 2, 20, 22);
  // arch top
  ctx.fillStyle = COL.HILL_DEN;
  px(dx, dy, 2, 4);
  px(dx + 18, dy, 2, 4);
  // sign / paw print
  ctx.fillStyle = COL.CREAM;
  px(o.x + o.w / 2 - 1, dy - 8, 2, 2);
  px(o.x + o.w / 2 - 4, dy - 6, 2, 2);
  px(o.x + o.w / 2 + 2, dy - 6, 2, 2);
}

function drawCoin(c) {
  const t = frameCount * 0.15;
  const wobble = Math.abs(Math.sin(t));
  const w = Math.max(2, Math.floor(8 * wobble));
  const offset = Math.floor((8 - w) / 2);
  ctx.fillStyle = COL.GOLD_DK;
  px(c.x - w / 2, c.y - 4, w, 8);
  ctx.fillStyle = COL.GOLD;
  px(c.x - w / 2 + 1, c.y - 3, Math.max(1, w - 2), 6);
  ctx.fillStyle = COL.GOLD_LT;
  if (w > 3) px(c.x - w / 2 + 1, c.y - 3, 1, 6);
}

function drawBamboo(c) {
  // vertical green stalk with segments
  ctx.fillStyle = COL.BAMBOO_DK;
  px(c.x - 2, c.y - 8, 4, 14);
  ctx.fillStyle = COL.BAMBOO;
  px(c.x - 1, c.y - 8, 2, 14);
  // node rings
  ctx.fillStyle = COL.BAMBOO_DK;
  px(c.x - 2, c.y - 5, 4, 1);
  px(c.x - 2, c.y, 4, 1);
  px(c.x - 2, c.y + 5, 4, 1);
  // leaves
  ctx.fillStyle = COL.LEAF;
  px(c.x + 2, c.y - 9, 4, 2);
  px(c.x - 6, c.y - 7, 4, 2);
  px(c.x + 1, c.y - 11, 3, 3);
}

function drawFruit(c) {
  // red apple-like fruit
  ctx.fillStyle = COL.FRUIT_DK;
  px(c.x - 4, c.y - 3, 8, 8);
  ctx.fillStyle = COL.FRUIT;
  px(c.x - 3, c.y - 3, 6, 7);
  ctx.fillStyle = '#ff8a7a';
  px(c.x - 2, c.y - 2, 2, 2);
  // stem
  ctx.fillStyle = COL.LOG_DK;
  px(c.x, c.y - 5, 1, 2);
  // leaf
  ctx.fillStyle = COL.LEAF;
  px(c.x + 1, c.y - 6, 3, 2);
}

function drawCollectible(c) {
  if (c.type === 'coin') drawCoin(c);
  else if (c.type === 'bamboo') drawBamboo(c);
  else if (c.type === 'fruit') drawFruit(c);
}

// ============================================================
// PHASE 2/3 OBSTACLE DRAWING
// ============================================================
function drawFence(o) {
  // Tall iron picket fence segment
  ctx.fillStyle = COL.FENCE_DK;
  px(o.x, o.y, o.w, o.h);
  ctx.fillStyle = '#c0a070';
  px(o.x + 2, o.y + 2, o.w - 4, 2);
  // pickets pattern
  ctx.fillStyle = COL.FENCE_DK;
  for (let i = 1; i < o.w - 1; i += 4) {
    px(o.x + i, o.y + 4, 1, o.h - 6);
  }
  ctx.fillStyle = '#3a2a1a';
  px(o.x, o.y + o.h - 2, o.w, 2);
  // pointed top
  ctx.fillStyle = '#c0a070';
  px(o.x + 1, o.y - 1, o.w - 2, 1);
}

function drawDumpster(o) {
  // metal dumpster, dark teal/green
  ctx.fillStyle = '#3a5a4a';
  px(o.x, o.y, o.w, o.h);
  ctx.fillStyle = '#5a7a6a';
  px(o.x, o.y, o.w, 2);
  px(o.x, o.y, 2, o.h);
  ctx.fillStyle = '#1a2a1f';
  px(o.x + o.w - 2, o.y, 2, o.h);
  px(o.x, o.y + o.h - 2, o.w, 2);
  // lid
  ctx.fillStyle = '#2a3a2f';
  px(o.x, o.y - 3, o.w, 4);
  ctx.fillStyle = '#5a7a6a';
  px(o.x, o.y - 3, o.w, 1);
  // grime stripes
  ctx.fillStyle = '#1a2a1f';
  px(o.x + 4, o.y + 6, 2, o.h - 10);
  px(o.x + o.w - 8, o.y + 8, 2, o.h - 12);
}

function drawTrashcan(o) {
  // round metal trash can
  ctx.fillStyle = '#5a5a5a';
  px(o.x, o.y + 3, o.w, o.h - 3);
  ctx.fillStyle = '#7a7a7a';
  px(o.x, o.y + 3, 2, o.h - 5);
  ctx.fillStyle = '#3a3a3a';
  px(o.x + o.w - 2, o.y + 3, 2, o.h - 3);
  // ring bands
  ctx.fillStyle = '#3a3a3a';
  px(o.x, o.y + 8, o.w, 1);
  px(o.x, o.y + o.h - 6, o.w, 1);
  // lid
  ctx.fillStyle = '#3a3a3a';
  px(o.x - 1, o.y, o.w + 2, 4);
  ctx.fillStyle = '#5a5a5a';
  px(o.x, o.y + 1, o.w, 1);
}

function drawPuddle(o) {
  if (o.h <= 6) {
    // shallow puddle
    ctx.fillStyle = '#222';
    px(o.x, o.y, o.w, 2);
    ctx.fillStyle = COL.WATER;
    px(o.x + 1, o.y + 1, o.w - 2, o.h - 2);
    ctx.fillStyle = COL.WATER_LT;
    px(o.x + 4, o.y + 1, 6, 1);
    px(o.x + o.w - 10, o.y + 2, 6, 1);
  } else {
    // pit puddle (like stream)
    ctx.fillStyle = COL.DIRT_DK;
    px(o.x - 2, o.y, 2, 8);
    px(o.x + o.w, o.y, 2, 8);
    ctx.fillStyle = '#1a2a3a';
    px(o.x, o.y, o.w, o.h);
    ctx.fillStyle = '#2a4a5a';
    px(o.x, o.y + 2, o.w, o.h - 4);
    ctx.fillStyle = '#3a5a6a';
    for (let i = 0; i < o.w; i += 6) {
      const wave = Math.floor(Math.sin((frameCount * 0.1 + i * 0.5)) * 1);
      px(o.x + i, o.y + 2 + wave, 3, 1);
    }
  }
}

function drawHydrant(o) {
  // red fire hydrant
  ctx.fillStyle = '#a82a1a';
  px(o.x, o.y + 4, o.w, o.h - 4);
  ctx.fillStyle = '#c84a3a';
  px(o.x, o.y + 4, 2, o.h - 4);
  ctx.fillStyle = '#681010';
  px(o.x + o.w - 2, o.y + 4, 2, o.h - 4);
  // top cap
  ctx.fillStyle = '#a82a1a';
  px(o.x - 1, o.y, o.w + 2, 4);
  ctx.fillStyle = '#fbd02c';
  px(o.x + o.w / 2 - 1, o.y + 1, 2, 2);
  // side nozzles

// ============================================================
// MOVING OBSTACLES UPDATE
// ============================================================
function updateMovingObstacles() {
  for (let i = 0; i < obstacles.length; i++) {
    const ob = obstacles[i];
    if (!ob.mv) continue;
    const mv = ob.mv;
    if (mv.type === 'patrol') {
      ob.x += mv.dir * mv.speed;
      if (ob.x >= mv.baseX + mv.range) {
        ob.x = mv.baseX + mv.range;
        mv.dir = -1;
      } else if (ob.x <= mv.baseX) {
        ob.x = mv.baseX;
        mv.dir = 1;
      }
      if (mv.rotates) {
        mv.rot = (mv.rot || 0) + mv.dir * mv.speed * 0.12;
      }
    } else if (mv.type === 'loop_left') {
      ob.x -= mv.speed;
      if (ob.x + ob.w < -50) ob.x = LEVEL_W + 30;
      if (mv.rotates) mv.rot = (mv.rot || 0) - mv.speed * 0.12;
    } else if (mv.type === 'loop_right') {
      ob.x += mv.speed;
      if (ob.x > LEVEL_W + 30) ob.x = -ob.w - 30;
      if (mv.rotates) mv.rot = (mv.rot || 0) + mv.speed * 0.12;
    }
  }
}

// ============================================================
// HUD
// ============================================================
function drawHud() {
  // Health bar
  ctx.fillStyle = COL.BLACK;
  ctx.fillRect(6, 6, 104, 12);
  ctx.fillStyle = '#444';
  ctx.fillRect(8, 8, 100, 8);
  // health color: green > yellow > red
  let hcol;
  if (player.health > 60) hcol = '#5cba4a';
  else if (player.health > 30) hcol = '#fbd02c';
  else hcol = '#e84a3a';
  ctx.fillStyle = hcol;
  ctx.fillRect(8, 8, player.health, 8);
  // border highlights
  ctx.fillStyle = COL.WHITE;
  ctx.fillRect(8, 8, 100, 1);

  // Heart icon
  ctx.fillStyle = '#e84a3a';
  ctx.fillRect(112, 8, 2, 2);
  ctx.fillRect(116, 8, 2, 2);
  ctx.fillRect(110, 10, 8, 2);
  ctx.fillRect(112, 12, 6, 1);
  ctx.fillRect(114, 13, 2, 1);

  // Score
  ctx.fillStyle = COL.WHITE;
  ctx.strokeStyle = COL.BLACK;
  ctx.lineWidth = 2;
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  const scoreText = 'SCORE ' + score;
  ctx.strokeText(scoreText, VW - 6, 6);
  ctx.fillText(scoreText, VW - 6, 6);

  // Mute indicator
  if (audio.muted) {
    ctx.font = 'bold 9px "Courier New", monospace';
    ctx.fillStyle = '#ff6666';
    ctx.strokeStyle = COL.BLACK;
    ctx.lineWidth = 2;
    ctx.strokeText('MUTED  [M]', VW - 6, 22);
    ctx.fillText('MUTED  [M]', VW - 6, 22);
  }
  ctx.textAlign = 'left';
}

// ============================================================
// HINT TEXT (in world space)
// ============================================================
function worldText(text, x, y, size) {
  size = size || 10;
  ctx.font = 'bold ' + size + 'px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = COL.BLACK;
  ctx.fillStyle = COL.WHITE;
  ctx.strokeText(text, x, y);
  ctx.fillText(text, x, y);
  ctx.textAlign = 'left';
}

function drawHints() {

}

  const theme = meta ? meta.theme : 'zoo';
  let topCol = COL.GRASS, midCol = COL.GRASS_DK, dirtCol = COL.DIRT, dirtDk = COL.DIRT_DK;

  if (theme === 'city_alley' || theme === 'city_street' || theme === 'highway') {
    topCol = '#5a5a5a'; midCol = '#3a3a3a'; dirtCol = '#2a2a2a'; dirtDk = '#1a1a1a';

    topCol = '#9a9a9a'; midCol = '#7a7a7a'; dirtCol = '#5a5a5a'; dirtDk = '#3a3a3a';

  } else if (theme === 'forest' || theme === 'deep_forest') {
    topCol = '#5cba4a'; midCol = '#2a6a20'; dirtCol = '#5a3a2a'; dirtDk = '#3a2a1a';
  } else if (theme === 'suburbs') {
    topCol = '#7ada5a'; midCol = '#3a8a30'; dirtCol = '#7a5a3a'; dirtDk = '#5a3a2a';

  for (let i = 0; i < groundSegs.length; i++) {

      for (let x = s; x < e; x += 12) px(x + ((x * 7) % 8), GROUND_Y - 1, 1, 2);
    }
    ctx.fillStyle = dirtCol;    px(s, GROUND_Y + 6, e - s, VH - GROUND_Y - 6);

      for (let x = s; x < e; x += 32) {

// ============================================================
// UPDATE
// ============================================================
function clearKeyPressed() {
  for (const k in keyPressed) keyPressed[k] = false;
}

function updateTitle() {
  stateTimer++;
  if (keyPressed['Space']) {
    score = 0;
    levelsCompleted = new Set();
    storyPanel = 0;
    gameState = STATE.STORY;
    stateTimer = 0;
  }
}

function updateGameOver() {
  stateTimer++;
  if (stateTimer > 30 && keyPressed['Space']) {
    gameState = STATE.TITLE;
    stateTimer = 0;
  }
}

function updateWin() {
  stateTimer++;
  if (stateTimer > 30 && keyPressed['Space']) {
    // Level complete → map screen
    gameState = STATE.MAP;
    stateTimer = 0;
  }
}

function updateStory() {
  stateTimer++;
  if (stateTimer > 15 && keyPressed['Space']) {
    storyPanel++;
    stateTimer = 0;
    if (storyPanel >= 3) {
      // Done with story — start L1
      loadLevel(1);
      gameState = STATE.PLAYING;
      stateTimer = 0;
    }
  }
}

function updateMap() {
  stateTimer++;
  if (stateTimer > 30 && keyPressed['Space']) {
    // Advance to next level
    const next = currentLevel + 1;
    loadLevel(next);
    gameState = STATE.PLAYING;
    stateTimer = 0;
  }
}

function updateGameWin() {
  stateTimer++;
  if (stateTimer > 60 && keyPressed['Space']) {
    gameState = STATE.TITLE;
    stateTimer = 0;
  }
}

function findStreamAt(centerX) {
  for (let i = 0; i < obstacles.length; i++) {
    const ob = obstacles[i];
    if (ob.type !== 'stream' && ob.type !== 'puddle') continue;
    if (centerX >= ob.x && centerX < ob.x + ob.w) return ob;
  }
  return null;
}

function findClimbable() {
  const pBox = getPlayerHitbox();
  for (let i = 0; i < obstacles.length; i++) {
    const ob = obstacles[i];
    if (!SOLID_TYPES.has(ob.type)) continue;
    // ladder zone: a strip on the left side of the object plus the body itself
    const zone = { x: ob.x - 6, y: ob.y - 2, w: ob.w + 12, h: ob.h + 4 };
    if (aabb(pBox, zone)) return ob;
  }
  return null;
}

function updatePlaying() {
  const left = keys['ArrowLeft'];
  const right = keys['ArrowRight'];
  const up = keys['ArrowUp'];
  const down = keys['ArrowDown'];
  const upJustPressed = !!keyPressed['ArrowUp'];
  const spaceJustPressed = !!keyPressed['Space'];

  if (player.invincible > 0) player.invincible--;

  const wasOnGround = player.onGround;

  // Move all moving obstacles before collision
  updateMovingObstacles();

  // Detect ice patch under player feet (only matters when on ground)
  let onIce = false;
  if (player.onGround) {
    const cx = player.x + player.w / 2;
    for (let i = 0; i < obstacles.length; i++) {
      const ob = obstacles[i];
      if (ob.type !== 'ice') continue;
      if (cx >= ob.x && cx < ob.x + ob.w) { onIce = true; break; }
    }
  }

  const climbable = findClimbable();

  // Climb start — only when player's feet are below the top of the object
  // (prevents re-entering climb mode when already standing on top)
  const pHbTemp = getPlayerHitbox();
  if (!player.climbing && climbable && upJustPressed &&
      pHbTemp.y + pHbTemp.h > climbable.y + 2) {
    player.climbing = true;
    player.vy = 0; player.vx = 0;
    // Snap x near the side of the climbable so visuals make sense
    if (player.x + player.w / 2 < climbable.x) {
      player.x = climbable.x - player.w + 1;
    } else if (player.x + player.w / 2 > climbable.x + climbable.w) {
      player.x = climbable.x + climbable.w - 1;
    }
  }

  if (player.climbing) {
    player.vx = 0;
    player.vy = 0;
    if (up) player.y -= CLIMB_SPEED;
    if (down) player.y += CLIMB_SPEED;
    if (left) { player.x -= 1; player.facing = -1; }
    if (right) { player.x += 1; player.facing = 1; }
    player.state = 'climb';
    player.animTimer++;
    if (player.animTimer >= 8) {
      player.animTimer = 0;
      player.animFrame = (player.animFrame + 1) % 2;
    }
    if (spaceJustPressed) {
      // jump off while climbing
      player.climbing = false;
      player.vy = JUMP_V * 0.8;
      player.onGround = false;
      playSfx('jump');
    }
    if (!climbable) {
      player.climbing = false;
    } else if (player.y + player.h <= climbable.y) {
      // reached top — place feet on top
      player.climbing = false;
      player.y = climbable.y - player.h;
      player.vy = 0;
      player.onGround = true;
      player.lastSafeX = player.x;
      player.lastSafeY = player.y;
    } else if (player.y + player.h > GROUND_Y) {
      player.climbing = false;
      player.y = GROUND_Y - player.h;
    }
  } else if (player.swimming) {
    // Swimming physics — reduced speed, buoyancy, health drain
    if (right && !left) { player.vx = WALK_SPEED * 0.55; player.facing = 1; }
    else if (left && !right) { player.vx = -WALK_SPEED * 0.55; player.facing = -1; }
    else player.vx *= 0.85;

    if (spaceJustPressed || upJustPressed) {
      player.vy = -2.5;
      playSfx('jump');
    } else {
      player.vy += GRAVITY * 0.18;
      if (player.vy > 1.2) player.vy = 1.2;
    }

    // Slow health drain while swimming
    if (frameCount % 80 === 0) damage(4);

    player.onGround = false;
    player.ducking = false;

  } else {
    // Movement (ice gives momentum)
    if (onIce) {
      if (right && !left) {
        player.vx = Math.min(player.vx + 0.18, WALK_SPEED);
        player.facing = 1;
      } else if (left && !right) {
        player.vx = Math.max(player.vx - 0.18, -WALK_SPEED);
        player.facing = -1;
      } else {
        player.vx *= 0.94;
        if (Math.abs(player.vx) < 0.08) player.vx = 0;
      }
    } else {
      if (right && !left) { player.vx = WALK_SPEED; player.facing = 1; }
      else if (left && !right) { player.vx = -WALK_SPEED; player.facing = -1; }
      else { player.vx = 0; }
    }

    // Duck — allow left/right movement while crouching (at reduced speed)
    const wasDucking = player.ducking;
    if (down && player.onGround) {
      player.ducking = true;
      if (!onIce) player.vx *= 0.6;
    } else {
      player.ducking = false;
    }
    if (player.ducking && !wasDucking) playSfx('duck');

    // Jump
    const jumpInput = spaceJustPressed || (upJustPressed && !climbable);
    if (jumpInput && player.onGround && !player.ducking) {
      player.vy = JUMP_V;
      player.onGround = false;
      playSfx('jump');
    }

    // Gravity
    player.vy += GRAVITY;
    if (player.vy > 12) player.vy = 12;
  }

  // === Move X/Y + Collision (runs for both swimming and normal, not climbing) ===
  if (!player.climbing) {
    // === Move X ===
    player.x += player.vx;
    // bounds
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > LEVEL_W) player.x = LEVEL_W - player.w;

    // Side collision with solid blocks
    let pBox = getPlayerHitbox();
    for (let i = 0; i < obstacles.length; i++) {
      const ob = obstacles[i];
      if (!SOLID_TYPES.has(ob.type)) continue;
      // allow being on top
      if (pBox.y + pBox.h <= ob.y + 2) continue;
      if (aabb(pBox, ob)) {
        damage(ob.dmg || 5);
        if (player.vx > 0) player.x = ob.x - player.w;
        else if (player.vx < 0) player.x = ob.x + ob.w;
        else player.x = (player.x < ob.x) ? ob.x - player.w : ob.x + ob.w;
        pBox = getPlayerHitbox();
      }
    }

    // === Move Y ===
    const oldFeet = pBox.y + pBox.h;
    player.y += player.vy;
    pBox = getPlayerHitbox();

    // One-way platform top collision (any solid)
    if (player.vy >= 0) {
      for (let i = 0; i < obstacles.length; i++) {
        const ob = obstacles[i];
        if (!SOLID_TYPES.has(ob.type)) continue;
        if (oldFeet <= ob.y + 1 && pBox.y + pBox.h > ob.y &&
            pBox.x + pBox.w > ob.x && pBox.x < ob.x + ob.w) {
          // land on top
          const newY = ob.y - (player.ducking ? 14 : 24) - (player.ducking ? 10 : 0);
          player.y = newY;
          player.vy = 0;
          player.onGround = true;
          player.lastSafeX = player.x;
          player.lastSafeY = player.y;
          pBox = getPlayerHitbox();
          break;
        }
      }
    }

    // Ground / stream collision
    const feetY = pBox.y + pBox.h;
    const playerCenter = player.x + player.w / 2;
    if (feetY >= GROUND_Y) {
      if (groundXAt(playerCenter)) {
        const yOff = player.ducking ? 10 : 0;
        const hitH = player.ducking ? 14 : 24;
        player.y = GROUND_Y - hitH - yOff;
        player.vy = 0;
        player.onGround = true;
        player.swimming = false;
        player.lastSafeX = player.x;
        player.lastSafeY = player.y;
      } else {
        player.onGround = false;
        const stream = findStreamAt(playerCenter);
        if (stream && feetY >= GROUND_Y + 4) {
          // Enter / stay in water — swimming!
          if (!player.swimming) {
            player.swimming = true;
            player.vy = Math.min(player.vy, 1.0);
          }
          // Clamp to stream bottom
          if (player.y + 24 > GROUND_Y + stream.h - 2) {
            player.y = GROUND_Y + stream.h - 2 - 24;
            player.vy = 0;
          }
          // Popped back above surface — exit water
          if (player.y + 24 < GROUND_Y) {
            player.swimming = false;
            player.vy = Math.min(player.vy, -1);
          }
        } else if (!stream && feetY >= GROUND_Y + 14) {
          // Fell into a non-stream gap — damage and reset
          damage(10);
          player.x = player.lastSafeX;
          player.y = player.lastSafeY;
          player.vy = 0;
          player.vx = 0;
          player.onGround = true;
          player.swimming = false;
        }
      }
    } else {
      // Check still on a platform
      let stillSupported = false;
      const checkY = pBox.y + pBox.h;
      for (let i = 0; i < obstacles.length; i++) {
        const ob = obstacles[i];
        if (!SOLID_TYPES.has(ob.type)) continue;
        if (Math.abs(checkY - ob.y) <= 1 &&
            player.x + player.w > ob.x && player.x < ob.x + ob.w) {
          stillSupported = true;
          break;
        }
      }
      if (!stillSupported && player.vy > 0.1) player.onGround = false;
    }

    // Hazard collision
    pBox = getPlayerHitbox();
    for (let i = 0; i < obstacles.length; i++) {
      const ob = obstacles[i];
      const isDuckable = HAZARD_DUCKABLE.has(ob.type);
      const isGround = HAZARD_GROUND.has(ob.type);
      if (!isDuckable && !isGround) continue;
      if (isDuckable && player.ducking) continue;
      if (!aabb(pBox, ob)) continue;
      damage(ob.dmg || 15);
      if (player.vx > 0) player.x -= 6;
      else if (player.vx < 0) player.x += 6;
      else player.x -= player.facing * 6;
      if (player.vy > 0) player.vy = -3;
    }

    // Den / win
    for (let i = 0; i < obstacles.length; i++) {
      const ob = obstacles[i];
      if (ob.type !== 'den') continue;
      const denW = ob.big ? 32 : 24;
      const denH = ob.big ? 32 : 24;
      const denMouth = {
        x: ob.x + ob.w / 2 - denW / 2,
        y: ob.y + ob.h - denH,
        w: denW, h: denH
      };
      if (aabb(pBox, denMouth)) {
        levelsCompleted.add(currentLevel);
        stopMusic();
        if (currentLevel === 10) {
          gameState = STATE.GAMEWIN;
          playSfx('win');
        } else {
          gameState = STATE.WIN;
          playSfx('level_complete');
        }
        stateTimer = 0;
      }
    }

    // Animation state
    if (player.swimming) player.state = player.animFrame % 2 === 0 ? 'walk' : 'jump';
    else if (player.ducking) player.state = 'duck';
    else if (!player.onGround) player.state = 'jump';
    else if (player.vx !== 0) player.state = 'walk';
    else player.state = 'idle';

    player.animTimer++;
    if (player.state === 'walk') {
      if (player.animTimer >= 8) {
        player.animTimer = 0;
        player.animFrame = (player.animFrame + 1) % 2;
      }
    } else {
      player.animFrame = 0;
    }
  } // end if (!player.climbing)

  // Collectibles
  const pickupBox = { x: player.x - 2, y: player.y - 2, w: player.w + 4, h: player.h + 4 };
  for (let i = 0; i < collectibles.length; i++) {
    const c = collectibles[i];
    if (c.taken) continue;
    const cBox = { x: c.x - 6, y: c.y - 8, w: 12, h: 16 };
    if (aabb(pickupBox, cBox)) {
      c.taken = true;
      if (c.type === 'coin') {
        score += 10;
        playSfx('coin');
      } else if (c.type === 'bamboo') {
        player.health = Math.min(100, player.health + 15);
        playSfx('food');
      } else if (c.type === 'fruit') {
        player.health = Math.min(100, player.health + 20);
        playSfx('food');
      }
    }
  }

  // Score for passed obstacles
  for (let i = 0; i < obstacles.length; i++) {
    const ob = obstacles[i];
    if (ob.type === 'den') continue;
    if (player.x > ob.x + ob.w && !obstaclesPassed.has(i)) {
      obstaclesPassed.add(i);
      score += 2;
    }
  }

  // Land SFX on transition from air to ground
  if (player.onGround && !wasOnGround && gameState === STATE.PLAYING) {
    playSfx('land');
  }

  // Camera follow
  const targetX = player.x - VW * 0.25;
  camera.x = Math.max(0, Math.min(LEVEL_W - VW, targetX));
}

function renderPlaying() {
  drawThemedBg();

  ctx.save();
  ctx.translate(-Math.floor(camera.x), 0);

  drawGroundThemed();

  // Pits / water hazards (drawn into the gap)
  for (let i = 0; i < obstacles.length; i++) {
    const ob = obstacles[i];
    if (ob.type === 'stream') drawStream(ob);
    else if (ob.type === 'puddle') drawPuddle(ob);
  }
  // Ice patches (ground level)
  for (let i = 0; i < obstacles.length; i++) {
    if (obstacles[i].type === 'ice') drawIcePatch(obstacles[i]);
  }
  // Den at back
  for (let i = 0; i < obstacles.length; i++) {
    const ob = obstacles[i];
    if (ob.type === 'den') {
      if (ob.big) drawBigDen(ob);
      else drawDen(ob);
    }
  }
  // Other obstacles
  for (let i = 0; i < obstacles.length; i++) {
    const ob = obstacles[i];
    switch (ob.type) {
      case 'rock':        drawRock(ob); break;
      case 'log':         drawLog(ob); break;
      case 'box':         drawBox(ob); break;
      case 'stump':       drawStump(ob); break;
      case 'branch':      drawBranch(ob); break;
      case 'fence':       drawFence(ob); break;
      case 'dumpster':    drawDumpster(ob); break;
      case 'trashcan':    drawTrashcan(ob); break;
      case 'hydrant':     drawHydrant(ob); break;
      case 'newsstand':   drawNewsstand(ob); break;
      case 'parked_car':  drawParkedCar(ob); break;
      case 'car':         drawCar(ob); break;
      case 'truck':       drawTruck(ob); break;
      case 'bench':       drawBench(ob); break;
      case 'hedge':       drawHedge(ob); break;
      case 'gnome':       drawGnome(ob); break;
      case 'dog':         drawDog(ob); break;
      case 'wheeliebin':  drawWheelieBin(ob); break;
      case 'barrier':     drawBarrier(ob); break;
      case 'treeroot':    drawTreeRoot(ob); break;
      case 'boulder':     drawBoulder(ob); break;
      case 'rolling_log': drawRollingLog(ob); break;
      case 'fountain':    drawFountain(ob); break;
      case 'outcrop':     drawOutcrop(ob); break;
    }
  }

  // Collectibles
  for (let i = 0; i < collectibles.length; i++) {
    if (!collectibles[i].taken) drawCollectible(collectibles[i]);
  }

  // Hint signs (level 1 only)
  drawHints();

  // Player (with i-frame blink)
  if (player.invincible <= 0 || Math.floor(player.invincible / 4) % 2 === 0) {
    drawReddy(player.x, player.y, player.state, player.animFrame, player.facing, player.ducking);
  }

  ctx.restore();

  drawHud();

  // Level intro banner
  if (stateTimer < 120) {
    const meta = LEVEL_META[currentLevel];
    const fade = stateTimer < 90 ? 1 : (120 - stateTimer) / 30;
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = COL.BLACK;
    ctx.fillStyle = COL.GOLD;
    ctx.globalAlpha = fade;
    ctx.strokeText('LEVEL ' + currentLevel + ' - ' + meta.name, VW / 2, 56);
    ctx.fillText('LEVEL ' + currentLevel + ' - ' + meta.name, VW / 2, 56);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }
}

  }

  // Press space prompt
  if (Math.floor(stateTimer / 30) % 2 === 0) {
    ctx.font = 'bold 9px "Courier New", monospace';
    ctx.fillStyle = COL.WHITE;
    ctx.lineWidth = 2;
    ctx.strokeText('PRESS SPACE TO CONTINUE', VW / 2, 248);
    ctx.fillText('PRESS SPACE TO CONTINUE', VW / 2, 248);
  }
  ctx.textAlign = 'left';
}

function renderMap() {
  // Background — sky to nature gradient
  ctx.fillStyle = '#3a3a5a';
  ctx.fillRect(0, 0, VW, 50);
  ctx.fillStyle = '#5a6a8a';
  ctx.fillRect(0, 50, VW, 50);
  ctx.fillStyle = '#7aaa6a';
  ctx.fillRect(0, 100, VW, 100);
  ctx.fillStyle = '#3a6a3a';
  ctx.fillRect(0, 200, VW, 70);

  // Title
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.lineWidth = 4;
  ctx.strokeStyle = COL.BLACK;
  ctx.fillStyle = COL.GOLD;
  ctx.strokeText("REDDY'S JOURNEY", VW / 2, 22);
  ctx.fillText("REDDY'S JOURNEY", VW / 2, 22);

  // Path nodes — winding from left (zoo) to right (home)
  const nodes = [];
  for (let i = 1; i <= 10; i++) {
    const t = (i - 1) / 9;
    const x = 30 + t * (VW - 60);
    const y = 160 + Math.sin(t * Math.PI * 2.2) * 35;
    nodes.push({ x: Math.floor(x), y: Math.floor(y), level: i });
  }

  // Draw path line connecting nodes
  ctx.strokeStyle = '#5b3a1b';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(nodes[0].x, nodes[0].y);
  for (let i = 1; i < nodes.length; i++) {
    ctx.lineTo(nodes[i].x, nodes[i].y);
  }
  ctx.stroke();
  // dashed cream highlight
  ctx.strokeStyle = COL.CREAM;
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(nodes[0].x, nodes[0].y);
  for (let i = 1; i < nodes.length; i++) {
    ctx.lineTo(nodes[i].x, nodes[i].y);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // Draw nodes
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    const isCurrent = (n.level === currentLevel + 1) || (n.level === currentLevel && !levelsCompleted.has(currentLevel));
    const isCompleted = levelsCompleted.has(n.level);
    const isFuture = n.level > currentLevel + 1 && !isCompleted;

    let r = 7;
    if (isCurrent) {
      const pulse = Math.floor(Math.abs(Math.sin(stateTimer * 0.12)) * 3);
      r = 7 + pulse;
    }

    // outer ring
    ctx.fillStyle = COL.BLACK;
    px(n.x - r - 1, n.y - r - 1, r * 2 + 2, r * 2 + 2);
    // fill
    if (isCompleted) ctx.fillStyle = COL.GOLD;
    else if (isCurrent) ctx.fillStyle = COL.RUST;
    else ctx.fillStyle = '#5a5a5a';
    px(n.x - r, n.y - r, r * 2, r * 2);
    // inner highlight
    if (isCompleted) {
      ctx.fillStyle = COL.GOLD_LT;
      px(n.x - r + 2, n.y - r + 2, 3, 3);
    }
    if (isCurrent) {
      ctx.fillStyle = COL.RUST_LT;
      px(n.x - r + 2, n.y - r + 2, 3, 3);
    }
    // checkmark on completed
    if (isCompleted) {
      ctx.fillStyle = COL.BLACK;
      px(n.x - 2, n.y - 1, 1, 3);
      px(n.x - 1, n.y, 1, 3);
      px(n.x, n.y - 1, 1, 3);
      px(n.x + 1, n.y - 2, 1, 3);
      px(n.x + 2, n.y - 3, 1, 3);
    }
    // node number
    ctx.font = 'bold 7px "Courier New", monospace';
    ctx.fillStyle = COL.WHITE;
    ctx.lineWidth = 2;
    ctx.strokeStyle = COL.BLACK;
    const lbl = String(n.level);
    ctx.strokeText(lbl, n.x, n.y + r + 9);
    ctx.fillText(lbl, n.x, n.y + r + 9);
    // level name (under node)
    ctx.font = 'bold 6px "Courier New", monospace';
    const meta = LEVEL_META[n.level];
    if (meta) {
      ctx.strokeText(meta.name, n.x, n.y + r + 18);
      ctx.fillText(meta.name, n.x, n.y + r + 18);
    }
  }

  // Reddy icon on current target node
  const targetLevel = currentLevel + 1;
  let targetNode = null;
  for (const n of nodes) if (n.level === targetLevel) { targetNode = n; break; }
  if (targetNode) {
    const bounce = Math.floor(Math.abs(Math.sin(stateTimer * 0.18)) * 3);
    drawReddy(targetNode.x - 6, targetNode.y - 30 - bounce, 'idle', 0, 1, false);
  }

  // Score (top right)
  ctx.font = 'bold 11px "Courier New", monospace';
  ctx.fillStyle = COL.GOLD;
  ctx.lineWidth = 3;
  ctx.strokeStyle = COL.BLACK;
  ctx.textAlign = 'right';
  const sTxt = 'SCORE: ' + score;
  ctx.strokeText(sTxt, VW - 10, 22);
  ctx.fillText(sTxt, VW - 10, 22);

  // Press space prompt (bottom)
  if (stateTimer > 30 && Math.floor(stateTimer / 30) % 2 === 0) {
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = COL.WHITE;
    ctx.strokeText('PRESS SPACE TO CONTINUE', VW / 2, 254);
    ctx.fillText('PRESS SPACE TO CONTINUE', VW / 2, 254);
  }
  ctx.textAlign = 'left';
}

function renderGameWin() {
  // bright forest victory
  drawBgDeepForest();
  // ground
  ctx.fillStyle = '#5cba4a';
  ctx.fillRect(0, GROUND_Y, VW, 6);
  ctx.fillStyle = '#2a6a20';
  ctx.fillRect(0, GROUND_Y + 4, VW, 2);
  ctx.fillStyle = '#5a3a2a';
  ctx.fillRect(0, GROUND_Y + 6, VW, VH - GROUND_Y - 6);

  // Big den in center
  drawBigDen({ x: VW / 2 - 40, y: GROUND_Y - 60, w: 80, h: 60, big: true });

  // Reddy at den, hopping happily
  const bounce = Math.floor(Math.abs(Math.sin(stateTimer * 0.15)) * 8);
  const reddyState = bounce > 2 ? 'jump' : 'idle';
  drawReddy(VW / 2 - 6, GROUND_Y - 24 - bounce, reddyState, 0, 1, false);

  // sparkles flying around
  for (let i = 0; i < 16; i++) {
    const angle = stateTimer * 0.05 + i * 0.6;
    const sx = VW / 2 + Math.cos(angle) * (60 + (i % 3) * 20);
    const sy = 100 + Math.sin(angle) * (40 + (i % 3) * 10);
    if (Math.floor(stateTimer / 4 + i) % 4 === 0) {
      ctx.fillStyle = i % 2 === 0 ? COL.GOLD_LT : COL.WHITE;
      px(Math.floor(sx), Math.floor(sy), 2, 2);
    }
  }

  // confetti
  for (let i = 0; i < 24; i++) {
    const fy = ((stateTimer * 1.5 + i * 22) % VH);
    const fx = (i * 67 + 30) % VW;
    const colors = [COL.GOLD, COL.FRUIT, COL.BAMBOO, '#3b82c4', '#9a4ac8'];
    ctx.fillStyle = colors[i % colors.length];
    px(fx, fy, 2, 4);
  }

  // Title text
  ctx.font = 'bold 22px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.lineWidth = 5;
  ctx.strokeStyle = COL.BLACK;
  ctx.fillStyle = COL.GOLD;
  ctx.strokeText('REDDY MADE IT HOME!', VW / 2, 50);
  ctx.fillText('REDDY MADE IT HOME!', VW / 2, 50);

  ctx.font = 'bold 11px "Courier New", monospace';
  ctx.lineWidth = 3;
  ctx.fillStyle = COL.WHITE;
  ctx.strokeText('THE GREAT ESCAPE IS COMPLETE', VW / 2, 78);
  ctx.fillText('THE GREAT ESCAPE IS COMPLETE', VW / 2, 78);

  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillStyle = COL.GOLD;
  ctx.strokeText('FINAL SCORE: ' + score, VW / 2, 102);
  ctx.fillText('FINAL SCORE: ' + score, VW / 2, 102);

  if (stateTimer > 60 && Math.floor(stateTimer / 30) % 2 === 0) {
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.fillStyle = COL.WHITE;
    ctx.lineWidth = 3;
    ctx.strokeText('PRESS SPACE TO PLAY AGAIN', VW / 2, 250);
    ctx.fillText('PRESS SPACE TO PLAY AGAIN', VW / 2, 250);
  }
  ctx.textAlign = 'left';
}

// ============================================================
// PAUSE
// ============================================================
function renderPaused() {
  // Draw the underlying game screen frozen behind the overlay
  renderPlaying();
  // Dark translucent overlay
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, VW, VH);
  // Pause box
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(VW / 2 - 80, 80, 160, 110);
  ctx.strokeStyle = '#f0c040';
  ctx.lineWidth = 3;
  ctx.strokeRect(VW / 2 - 80, 80, 160, 110);
  // Text
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 20px "Courier New", monospace';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#1a1010';
  ctx.fillStyle = '#f0c040';
  ctx.strokeText('PAUSED', VW / 2, 112);
  ctx.fillText('PAUSED', VW / 2, 112);
  ctx.font = 'bold 10px "Courier New", monospace';
  ctx.lineWidth = 2;
  ctx.fillStyle = '#ffffff';
  ctx.strokeText('ESC / P  —  RESUME', VW / 2, 138);
  ctx.fillText('ESC / P  —  RESUME', VW / 2, 138);
  ctx.fillStyle = '#ffaaaa';
  ctx.strokeText('Q  —  MAIN MENU', VW / 2, 155);
  ctx.fillText('Q  —  MAIN MENU', VW / 2, 155);
  ctx.fillStyle = audio.muted ? '#ff8888' : '#aaffaa';
  ctx.strokeText('M  —  ' + (audio.muted ? 'UNMUTE' : 'MUTE'), VW / 2, 172);
  ctx.fillText('M  —  ' + (audio.muted ? 'UNMUTE' : 'MUTE'), VW / 2, 172);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
}

function updatePaused() {
  if (keyPressed['Escape'] || keyPressed['KeyP']) {
    gameState = prevState;
  }
  if (keyPressed['KeyQ']) {
    gameState = STATE.TITLE;
    stateTimer = 0;
  }
}

function render() {
  if (gameState === STATE.TITLE) renderTitle();
  else if (gameState === STATE.PLAYING) renderPlaying();
  else if (gameState === STATE.GAMEOVER) renderGameOver();
  else if (gameState === STATE.WIN) renderWin();
  else if (gameState === STATE.STORY) renderStory();
  else if (gameState === STATE.MAP) renderMap();
  else if (gameState === STATE.GAMEWIN) renderGameWin();
  else if (gameState === STATE.PAUSED) renderPaused();
}

// ============================================================
// MAIN LOOP (fixed timestep)
// ============================================================
let lastTime = performance.now();
let acc = 0;
const STEP = 1000 / 60;

function loop(now) {
  let dt = now - lastTime;
  lastTime = now;
  if (dt > 250) dt = 250;
  acc += dt;
  while (acc >= STEP) {
    frameCount++;
    // Global pause toggle (works from PLAYING state)
    if (keyPressed['Escape'] || keyPressed['KeyP']) {
      if (gameState === STATE.PLAYING) {
        prevState = gameState;
        gameState = STATE.PAUSED;
        clearKeyPressed();
        acc -= STEP;
        continue;
      }
    }
    if (gameState === STATE.TITLE) updateTitle();
    else if (gameState === STATE.PLAYING) updatePlaying();
    else if (gameState === STATE.GAMEOVER) updateGameOver();
    else if (gameState === STATE.WIN) updateWin();
    else if (gameState === STATE.STORY) updateStory();
    else if (gameState === STATE.MAP) updateMap();
    else if (gameState === STATE.GAMEWIN) updateGameWin();
    else if (gameState === STATE.PAUSED) updatePaused();
    clearKeyPressed();
    acc -= STEP;
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
