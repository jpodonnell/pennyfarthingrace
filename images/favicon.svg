<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="8" fill="#1A1F5C"/>

  <!--
    Large front wheel: cx=20, cy=36, r=17  (ground y=53)
    Small rear wheel:  cx=50, cy=46, r=7   (ground y=53)
    Bike faces LEFT. Colors match Instagram graphic.
  -->

  <!-- Spokes - Large wheel (8) -->
  <g stroke="#C8A84B" stroke-width="0.8" opacity="0.75">
    <line x1="20" y1="36" x2="37" y2="36"/>
    <line x1="20" y1="36" x2="32" y2="48"/>
    <line x1="20" y1="36" x2="20" y2="53"/>
    <line x1="20" y1="36" x2="8"  y2="48"/>
    <line x1="20" y1="36" x2="3"  y2="36"/>
    <line x1="20" y1="36" x2="8"  y2="24"/>
    <line x1="20" y1="36" x2="20" y2="19"/>
    <line x1="20" y1="36" x2="32" y2="24"/>
  </g>

  <!-- Spokes - Small wheel (4) -->
  <g stroke="#C8A84B" stroke-width="0.9" opacity="0.75">
    <line x1="50" y1="46" x2="57" y2="46"/>
    <line x1="50" y1="46" x2="50" y2="53"/>
    <line x1="50" y1="46" x2="43" y2="46"/>
    <line x1="50" y1="46" x2="50" y2="39"/>
  </g>

  <!-- Large wheel rim + hub -->
  <circle cx="20" cy="36" r="17" stroke="#C8A84B" stroke-width="1.8" fill="none"/>
  <circle cx="20" cy="36" r="2"  fill="#C8A84B"/>

  <!-- Small wheel rim + hub -->
  <circle cx="50" cy="46" r="7"  stroke="#C8A84B" stroke-width="1.5" fill="none"/>
  <circle cx="50" cy="46" r="1.5" fill="#C8A84B"/>

  <!-- Fork (crown to axle) -->
  <path d="M 20,19 Q 18,27 19,36"
        stroke="#C8A84B" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Handlebar stem -->
  <line x1="20" y1="19" x2="20" y2="14"
        stroke="#C8A84B" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Handlebars (side view, extends forward) -->
  <path d="M 20,14 Q 16,12 13,15"
        fill="none" stroke="#C8A84B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Frame backbone (curved, fork crown to rear axle) -->
  <path d="M 20,19 C 32,22 44,36 50,46"
        fill="none" stroke="#C8A84B" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Seat post -->
  <line x1="26" y1="23" x2="26" y2="17"
        stroke="#C8A84B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Saddle -->
  <ellipse cx="26" cy="16" rx="5" ry="2" fill="#C8A84B"/>
</svg>
